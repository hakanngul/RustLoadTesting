[package]
name = "rustload"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first HTTP load testing studio"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_plot = "0.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hdrhistogram = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
csv = "1"
url = "2"
base64 = "0.22"
directories = "6"
thiserror = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
